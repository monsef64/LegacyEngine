name: Code formatting

on:
  push:
    paths: ['src/**', 'benchmarks/**', 'data/shaders/**', '.clang-format', 'tools/format_code.py', '.github/workflows/code-quality.yml']
  pull_request:
    paths: ['src/**', 'benchmarks/**', 'data/shaders/**', '.clang-format', 'tools/format_code.py', '.github/workflows/code-quality.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install clang-format==21.1.8
      - run: python tools/format_code.py --check
