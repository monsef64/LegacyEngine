name: Windows x64 build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  windows:
    name: Windows x64 Release (MinGW-w64)
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install MinGW-w64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-tools
      - name: Configure x64 Release
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_CXX_COMPILER=g++
          -DLEGACY_VENDORED_SDL=ON
          -DBUILD_TESTING=OFF
      - name: Build
        run: |
          cmake --build build --target LegacyEngine --parallel 4 > build.log 2>&1 || {
            echo "build failed"; exit 1;
          }
      # Compiler errors are worth reading on the run page itself, not only in
      # the log download, which is not always available.
      - name: Summarise build errors
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          errors=$(grep -E 'error:|fatal error|undefined reference|Error [0-9]' build.log |
                   head -60 || tail -60 build.log)
          # Annotations put each error on the run page itself.
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::$line"
          done <<< "$errors"
          {
            echo '### Windows build errors'
            echo '```'
            printf '%s\n' "$errors"
            echo '```'
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          # gh is not part of the MSYS2 image; the REST API needs only curl.
          body=$(python3 -c 'import json; print(json.dumps({"body": open("report.md").read()}))')
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            -d "$body" || true

      - name: Package executable, runtime DLLs and data
        run: |
          set -euo pipefail
          mkdir -p package/LegacyEngine
          cp build/LegacyEngine.exe package/LegacyEngine/
          # Strip only the distribution copy; retain the build binary for debugging.
          strip --strip-unneeded package/LegacyEngine/LegacyEngine.exe
          cp -R data package/LegacyEngine/data
          cp LICENSE package/LegacyEngine/
          # ldd lists transitive dependencies too. Bundle MinGW runtime DLLs,
          # but leave Windows system DLLs to the operating system.
          ldd build/LegacyEngine.exe > build/runtime-dependencies.txt
          awk '/=> \/ucrt64\/bin\// {print $3}' build/runtime-dependencies.txt |
            while IFS= read -r dll; do
              cp "$dll" package/LegacyEngine/
            done
          # Qt loads its platform plugin at run time, so it is not in the ldd
          # list; copy the Windows platform plugin where Qt will find it.
          mkdir -p package/LegacyEngine/platforms
          cp /ucrt64/share/qt6/plugins/platforms/qwindows.dll package/LegacyEngine/platforms/
      - uses: actions/upload-artifact@v4
        with:
          name: LegacyEngine-Windows-x64
          path: package/LegacyEngine/
          if-no-files-found: error
