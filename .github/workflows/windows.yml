name: Windows x64 build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      engine_version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64 Release (UCRT64)
            msystem: UCRT64
            prefix: mingw-w64-ucrt-x86_64
            runtime: ucrt64
            win7: 'OFF'
            suffix: Windows-x64
          - label: Windows 7 SP1 x64 compatibility (MSVCRT)
            msystem: MINGW64
            prefix: mingw-w64-x86_64
            runtime: mingw64
            win7: 'ON'
            suffix: Windows7-x64-experimental
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve engine version
        id: version
        shell: pwsh
        env:
          ENGINE_VERSION_OVERRIDE: ${{ inputs.engine_version }}
        run: |
          if ($env:ENGINE_VERSION_OVERRIDE) {
            "version=$env:ENGINE_VERSION_OVERRIDE" >> $env:GITHUB_OUTPUT
          } else {
            python tools/release_version.py
          }
      - name: Install MinGW-w64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            git
            python
            ${{ matrix.prefix }}-gcc
            ${{ matrix.prefix }}-cmake
            ${{ matrix.prefix }}-ninja
      - name: Configure x64 Release
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLEGACY_ENGINE_VERSION=${{ steps.version.outputs.version }}
          -DCMAKE_C_COMPILER=gcc
          -DCMAKE_CXX_COMPILER=g++
          -DLEGACY_VENDORED_SDL=ON
          -DBUILD_TESTING=OFF
          -DLEGACY_WINDOWS7=${{ matrix.win7 }}
      - name: Build
        run: cmake --build build --target LegacyEngine LegacyPlayer --parallel 4
      - name: Package executable, runtime DLLs and data
        run: |
          set -euo pipefail
          mkdir -p package/LegacyEngine
          cp build/LegacyEngine.exe build/LegacyPlayer.exe package/LegacyEngine/
          # Strip only the distribution copy; retain the build binary for debugging.
          strip --strip-unneeded package/LegacyEngine/LegacyEngine.exe package/LegacyEngine/LegacyPlayer.exe
          cmake -DPLAYER=package/LegacyEngine/LegacyPlayer.exe -P cmake/player_template.cmake
          cp -R data package/LegacyEngine/data
          cp LICENSE package/LegacyEngine/
          # ldd lists transitive dependencies too. Bundle MinGW runtime DLLs,
          # but leave Windows system DLLs to the operating system.
          { ldd build/LegacyEngine.exe; ldd build/LegacyPlayer.exe; } > build/runtime-dependencies.txt
          awk -v root="/${{ matrix.runtime }}/bin/" '$2 == "=>" && index($3, root) == 1 {print $3}' build/runtime-dependencies.txt |
            while IFS= read -r dll; do
              cp "$dll" package/LegacyEngine/
            done
      - name: Audit Windows 7 package imports
        if: matrix.win7 == 'ON'
        run: python tools/audit_windows7_imports.py package/LegacyEngine
      - name: Create downloadable Windows archive
        shell: pwsh
        env:
          ENGINE_VERSION: ${{ steps.version.outputs.version }}
          PACKAGE_SUFFIX: ${{ matrix.suffix }}
        run: Compress-Archive -Path package/LegacyEngine -DestinationPath "LegacyEngine-$env:ENGINE_VERSION-$env:PACKAGE_SUFFIX.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: LegacyEngine-${{ steps.version.outputs.version }}-${{ matrix.suffix }}
          path: LegacyEngine-*.zip
          if-no-files-found: error
