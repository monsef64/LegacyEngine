name: Release

# Builds the Linux binary.
#   - Pushing a tag such as v0.1.0 builds it and publishes it as a GitHub release.
#   - Running the workflow by hand on a branch only builds it; download the
#     result from the run's page.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - 'data/**'
      - 'src/**'
      - 'third_party/**'
      - 'CMakeLists.txt'
      - 'docs/**'
      - 'README.md'
      - 'scripts/**'
      - 'extensions/legacyscript/**'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'src/**'
      - 'third_party/**'
      - 'CMakeLists.txt'
      - 'docs/**'
      - 'README.md'
      - 'scripts/**'
      - 'extensions/legacyscript/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write # needed to create the release
  pull-requests: write # to report a failed smoke test on the PR

jobs:
  linux:
    name: Linux x86_64
    # The binary needs a system at least as new as the one it is built on.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Use an isolated Ubuntu source list: neither the Azure mirror nor
      # unrelated third-party repositories on the runner can stall this build.
      # Try a second HTTPS mirror if metadata or package downloads fail.
      - name: Install build dependencies
        timeout-minutes: 14
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          packages=(
            build-essential cmake ninja-build pkg-config git
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev
            libxi-dev libxss-dev libxtst-dev
            libwayland-dev libxkbcommon-dev libdecor-0-dev
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev
            libdbus-1-dev libibus-1.0-dev libudev-dev libusb-1.0-0-dev
            libasound2-dev libpulse-dev libpipewire-0.3-dev libjack-dev libsndio-dev
            libfribidi-dev libthai-dev liburing-dev
            qt6-base-dev xvfb gdb
          )
          sources="$RUNNER_TEMP/legacy-ubuntu.list"
          apt_options=(
            -o "Dir::Etc::sourcelist=$sources"
            -o Dir::Etc::sourceparts=-
            -o Acquire::ForceIPv4=true
            -o Acquire::Languages=none
            -o Acquire::Retries=1
            -o Acquire::http::Timeout=15
            -o Acquire::https::Timeout=15
            -o DPkg::Lock::Timeout=30
          )
          for mirror in https://mirrors.edge.kernel.org/ubuntu https://archive.ubuntu.com/ubuntu; do
            echo "::group::Ubuntu dependencies from $mirror"
            : > "$sources"
            for suite in noble noble-updates noble-security; do
              printf 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] %s %s main universe restricted multiverse\n' \
                "$mirror" "$suite" >> "$sources"
            done
            if sudo timeout --signal=TERM --kill-after=15s 90s \
                apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update &&
               sudo --preserve-env=DEBIAN_FRONTEND timeout --signal=TERM --kill-after=15s 270s \
                apt-get "${apt_options[@]}" install -y --no-install-recommends "${packages[@]}"; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::Dependency installation from $mirror failed or timed out; trying the next mirror."
          done
          echo "::error::Both Ubuntu mirrors failed within their time limits. See the APT output above."
          exit 1

      # SDL, Jolt, libstdc++ and libgcc are linked statically so that
      # the binary runs without any of them installed.
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DLEGACY_VENDORED_SDL=ON \
            "-DCMAKE_EXE_LINKER_FLAGS=-static-libgcc -static-libstdc++ -s"

      # SDL builds without a display backend whose development packages are
      # missing (it only stops when both are), and the released binary has to
      # work on X11 and on Wayland.
      - name: Check that SDL supports X11 and Wayland
        run: |
          config=$(find build/_deps/sdl3-build -name SDL_build_config.h)
          for feature in SDL_VIDEO_DRIVER_X11 SDL_VIDEO_DRIVER_WAYLAND \
                         SDL_VIDEO_OPENGL_GLX SDL_VIDEO_OPENGL_EGL; do
            if ! grep -q "^#define $feature 1" "$config"; then
              echo "::error::SDL was configured without $feature"
              exit 1
            fi
          done

      - name: Build
        run: |
          cmake --build build --parallel 2 > build.log 2>&1 || {
            echo "build failed"; exit 1;
          }
      - name: Summarise build errors
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Build errors'
            echo '```'
            grep -E 'error:|fatal error|undefined reference|Error [0-9]' build.log | head -50 ||
              tail -50 build.log 2>/dev/null || echo 'no build output'
            echo '```'
          } > build-report.md
          cat build-report.md >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "${{ github.event.pull_request.number }}" --body-file build-report.md || true

      # The widget tree on its own, with no engine and no GPU: this is the
      # test that catches a dock that never gets its widget or a panel left
      # null, which the frame loop below can only report as a crash.
      - name: Test the Qt editor shell
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          cmake -S . -B build-qt -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DLEGACY_VENDORED_SDL=ON 2>&1 | tee shell-config.log | tail -5
          cmake --build build-qt --target qt_editor_shell_tests --parallel 2 2>&1 | tee shell-build.log | tail -20
          # Run under gdb when it is available: a crash here has produced no
          # output at all, and a backtrace says more than a silent exit.
          if command -v gdb >/dev/null; then
            gdb -batch -ex run -ex "thread apply all bt 12" --args \
              ./build-qt/qt_editor_shell_tests 2>&1 | tee shell.log
          else
            stdbuf -o0 -e0 ./build-qt/qt_editor_shell_tests 2>&1 | tee shell.log
          fi
          echo "exit status: $?" | tee -a shell.log
      - name: Summarise the shell test
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Qt editor shell test'
            echo '```'
            echo '--- run ---'; tail -40 shell.log 2>/dev/null || echo 'no run output'
            echo '--- configure ---'; tail -15 shell-config.log 2>/dev/null || echo 'no configure output'
            echo '```'
          } > shell-report.md
          cat shell-report.md >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "${{ github.event.pull_request.number }}" --body-file shell-report.md || true

      # Renders 120 frames and exits on its own. A runner without a GPU still
      # exercises the whole frame path end to end: xvfb supplies the X display
      # for SDL's OpenGL context, Mesa's software rasterizer draws it, and Qt
      # runs offscreen so the widget tree needs no window manager.
      - name: Smoke test the editor
        env:
          # Qt draws the editor shell into its own window tree; offscreen keeps
          # it from needing a display server. SDL still needs a real GL
          # context, so xvfb supplies the X display it opens the window on.
          QT_QPA_PLATFORM: offscreen
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          # The engine logs how far it got. gdb, when present, also records
          # where it died, which the log alone cannot say.
          if command -v gdb >/dev/null; then
            xvfb-run --auto-servernum gdb -batch -ex run \
              -ex "thread apply all bt 15" --args ./build/LegacyEngine --smoke-test \
              2>&1 | tee smoke.log
          else
            xvfb-run --auto-servernum ./build/LegacyEngine --smoke-test 2>&1 | tee smoke.log
          fi
      # The engine logs where it got to before it died; put that on the run
      # page so a failure is readable without downloading the job log.
      - name: Summarise the smoke test
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Smoke test output'
            echo '```'
            tail -80 smoke.log 2>/dev/null || echo 'no output captured'
            echo '```'
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "${{ github.event.pull_request.number }}" --body-file report.md || true

      # README.md says which glibc the binary needs. The number depends on what
      # is linked into the binary, so show it on the page of the run.
      - name: Report the glibc version the binary needs
        run: |
          needed=$(objdump -T build/LegacyEngine | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1)
          echo "::notice::The binary needs glibc ${needed#GLIBC_} or newer"

      - name: Build offline documentation
        run: |
          python3 -m venv "$RUNNER_TEMP/docs-tools"
          "$RUNNER_TEMP/docs-tools/bin/python" -m pip install -r docs/requirements.txt
          "$RUNNER_TEMP/docs-tools/bin/python" docs/build.py --output build/docs --revision "$GITHUB_SHA"
          test -s build/docs/scripting-reference.html
          cd build/docs
          "$RUNNER_TEMP/docs-tools/bin/python" -m zipfile -c ../legacyengine-docs.zip *.html style.css screenshot.png LICENSE

      - name: Upload offline HTML documentation
        uses: actions/upload-artifact@v7
        with:
          name: legacyengine-docs
          path: build/docs/
          if-no-files-found: error
          retention-days: 30

      - name: Package
        run: |
          set -euxo pipefail
          timestamp=$(date -u +%Y%m%d-%H%M%S)
          package=LegacyEngine-$timestamp-linux-x86_64

          mkdir -p "$package"
          cp build/LegacyEngine "$package/"
          # Keep symbols in build/ for diagnosis, not in the shipped executable.
          strip --strip-unneeded "$package/LegacyEngine"
          cp LICENSE "$package/"
          # Qt is a system dependency of the release: bundling the Widgets
          # runtime and the xcb platform plugin keeps the tarball runnable on a
          # machine that has the Qt libraries installed (see README).
          mkdir -p "$package/qt-plugins/platforms"
          plugin=$(find /usr/lib/x86_64-linux-gnu/qt6/plugins/platforms -name "libqxcb.so" | head -n 1)
          if [ -n "$plugin" ]; then cp "$plugin" "$package/qt-plugins/platforms/"; fi
          cp -r build/docs "$package/docs"
          test -s "$package/docs/scripting-reference.html"
          cp -r scripts "$package/"
          python3 tools/collect_licenses.py build
          cp -r data "$package/"
          cp .luarc.json "$package/"
          test -s "$package/data/license/SDL3.txt"
          test -s "$package/data/license/assimp.txt"
          tar -czf "$package.tar.gz" "$package"

          echo "PACKAGE=$package" >> "$GITHUB_ENV"

      # Not zipped: what the run offers for download is the .tar.gz itself.
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ env.PACKAGE }}.tar.gz
          archive: false
          if-no-files-found: error

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # The workflow was run again for the same tag: replace the file.
            gh release upload "$GITHUB_REF_NAME" "$PACKAGE.tar.gz" build/legacyengine-docs.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$PACKAGE.tar.gz" build/legacyengine-docs.zip \
              --verify-tag --generate-notes --title "LegacyEngine $GITHUB_REF_NAME"
          fi

  vsix:
    name: Build LegacyScript VSIX
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: extensions/legacyscript
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extensions/legacyscript/package-lock.json
      - name: Install extension dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate API and package VSIX
        run: npm run generate && npm run package
      - name: Upload separate installable VSIX file
        uses: actions/upload-artifact@v7
        with:
          name: legacyscript-vsix
          path: extensions/legacyscript/legacyscript.vsix
          archive: false
          if-no-files-found: error
      - name: Attach VSIX to engine tag release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" legacyscript.vsix --clobber
