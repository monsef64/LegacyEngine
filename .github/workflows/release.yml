name: Release

# Builds the Linux binary.
#   - Pushing a tag such as v0.1.0 builds it and publishes it as a GitHub release.
#   - Running the workflow by hand on a branch only builds it; download the
#     result from the run's page.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - 'data/**'
      - 'src/**'
      - 'tests/**'
      - 'third_party/**'
      - 'CMakeLists.txt'
      - 'docs/**'
      - 'README.md'
      - 'scripts/**'
      - 'extensions/legacyscript/**'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'src/**'
      - 'tests/**'
      - 'third_party/**'
      - 'CMakeLists.txt'
      - 'docs/**'
      - 'README.md'
      - 'scripts/**'
      - 'extensions/legacyscript/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write # needed to create the release

jobs:
  linux:
    name: Linux x86_64
    # The binary needs a system at least as new as the one it is built on.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Use an isolated Ubuntu source list: neither the Azure mirror nor
      # unrelated third-party repositories on the runner can stall this build.
      # Try a second HTTPS mirror if metadata or package downloads fail.
      - name: Install build dependencies
        timeout-minutes: 14
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          packages=(
            build-essential cmake ninja-build pkg-config git
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev
            libxi-dev libxss-dev libxtst-dev
            libwayland-dev libxkbcommon-dev libdecor-0-dev
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev
            libdbus-1-dev libibus-1.0-dev libudev-dev libusb-1.0-0-dev
            libasound2-dev libpulse-dev libpipewire-0.3-dev libjack-dev libsndio-dev
            libfribidi-dev libthai-dev liburing-dev
            xvfb xauth libgl1-mesa-dri python3-pil
          )
          sources="$RUNNER_TEMP/legacy-ubuntu.list"
          apt_options=(
            -o "Dir::Etc::sourcelist=$sources"
            -o Dir::Etc::sourceparts=-
            -o Acquire::ForceIPv4=true
            -o Acquire::Languages=none
            -o Acquire::Retries=1
            -o Acquire::http::Timeout=15
            -o Acquire::https::Timeout=15
            -o DPkg::Lock::Timeout=30
          )
          for mirror in https://mirrors.edge.kernel.org/ubuntu https://archive.ubuntu.com/ubuntu; do
            echo "::group::Ubuntu dependencies from $mirror"
            : > "$sources"
            for suite in noble noble-updates noble-security; do
              printf 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] %s %s main universe restricted multiverse\n' \
                "$mirror" "$suite" >> "$sources"
            done
            if sudo timeout --signal=TERM --kill-after=15s 90s \
                apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update &&
               sudo --preserve-env=DEBIAN_FRONTEND timeout --signal=TERM --kill-after=15s 270s \
                apt-get "${apt_options[@]}" install -y --no-install-recommends "${packages[@]}"; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::Dependency installation from $mirror failed or timed out; trying the next mirror."
          done
          echo "::error::Both Ubuntu mirrors failed within their time limits. See the APT output above."
          exit 1

      # SDL, ReactPhysics3D, libstdc++ and libgcc are linked statically so that
      # the binary runs without any of them installed.
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLEGACY_VENDORED_SDL=ON \
            "-DCMAKE_EXE_LINKER_FLAGS=-static-libgcc -static-libstdc++ -s"

      # SDL builds without a display backend whose development packages are
      # missing (it only stops when both are), and the released binary has to
      # work on X11 and on Wayland.
      - name: Check that SDL supports X11 and Wayland
        run: |
          config=$(find build/_deps/sdl3-build -name SDL_build_config.h)
          for feature in SDL_VIDEO_DRIVER_X11 SDL_VIDEO_DRIVER_WAYLAND \
                         SDL_VIDEO_OPENGL_GLX SDL_VIDEO_OPENGL_EGL; do
            if ! grep -q "^#define $feature 1" "$config"; then
              echo "::error::SDL was configured without $feature"
              exit 1
            fi
          done

      - name: Build
        run: cmake --build build --parallel 2

      - name: Regression tests
        timeout-minutes: 5
        run: ctest --test-dir build --output-on-failure --timeout 60

      # Render a bounded number of real frames, then exercise normal teardown.
      # Timeout is only a watchdog: crashes, hangs and forced kills all fail.
      - name: Smoke test
        timeout-minutes: 2
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" \
            timeout -k 5s 60s build/LegacyEngine --smoke-test

      - name: Dynamic light and shadow rendering tests
        timeout-minutes: 2
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 640x480x24" timeout -k 5s 60s build/lighting_render_tests

      # README.md says which glibc the binary needs. The number depends on what
      # is linked into the binary, so show it on the page of the run.
      - name: Report the glibc version the binary needs
        run: |
          needed=$(objdump -T build/LegacyEngine | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1)
          echo "::notice::The binary needs glibc ${needed#GLIBC_} or newer"

      - name: Build and validate offline documentation
        run: |
          python3 -m venv "$RUNNER_TEMP/docs-tools"
          "$RUNNER_TEMP/docs-tools/bin/python" -m pip install -r docs/requirements.txt
          "$RUNNER_TEMP/docs-tools/bin/python" -m unittest discover -s docs/tests
          "$RUNNER_TEMP/docs-tools/bin/python" docs/build.py --output build/docs --revision "$GITHUB_SHA"
          cd build/docs
          "$RUNNER_TEMP/docs-tools/bin/python" -m zipfile -c ../legacyengine-docs.zip *.html style.css screenshot.png LICENSE

      - name: Upload offline HTML documentation
        uses: actions/upload-artifact@v7
        with:
          name: legacyengine-docs
          path: build/docs/
          if-no-files-found: error
          retention-days: 30

      - name: Package
        run: |
          timestamp=$(date -u +%Y%m%d-%H%M%S)
          package=LegacyEngine-$timestamp-linux-x86_64

          mkdir -p "$package/licenses"
          cp build/LegacyEngine "$package/"
          cp LICENSE "$package/"
          cp -r build/docs "$package/docs"
          cp -r scripts "$package/"
          cp -r data "$package/"
          cp .luarc.json "$package/"
          cp build/_deps/sdl3-src/LICENSE.txt "$package/licenses/SDL3.txt"
          cp build/_deps/reactphysics3d-src/LICENSE "$package/licenses/ReactPhysics3D.txt"
          cp build/_deps/imgui-src/LICENSE.txt "$package/licenses/DearImGui.txt"
          cp build/_deps/imguizmo-src/LICENSE "$package/licenses/ImGuizmo.txt"
          cp build/_deps/lua-src/lua.h "$package/licenses/Lua.txt"
          cp third_party/roboto/LICENSE "$package/licenses/Roboto.txt"
          cp third_party/glad/LICENSE "$package/licenses/glad.txt"
          cp third_party/miniaudio/LICENSE "$package/licenses/miniaudio.txt"
          cp third_party/simdjson/LICENSE "$package/licenses/simdjson.txt"
          cp third_party/fontawesome/LICENSE.txt "$package/licenses/FontAwesome.txt"
          cp third_party/stb/LICENSE "$package/licenses/stb.txt"
          cp third_party/json/LICENSE.MIT "$package/licenses/nlohmann-json.txt"
          tar -czf "$package.tar.gz" "$package"

          echo "PACKAGE=$package" >> "$GITHUB_ENV"

      # Not zipped: what the run offers for download is the .tar.gz itself.
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ env.PACKAGE }}.tar.gz
          archive: false
          if-no-files-found: error

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # The workflow was run again for the same tag: replace the file.
            gh release upload "$GITHUB_REF_NAME" "$PACKAGE.tar.gz" build/legacyengine-docs.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$PACKAGE.tar.gz" build/legacyengine-docs.zip \
              --verify-tag --generate-notes --title "LegacyEngine $GITHUB_REF_NAME"
          fi

  vsix:
    name: Build LegacyScript VSIX
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: extensions/legacyscript
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extensions/legacyscript/package-lock.json
      - name: Install extension dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate API, test and package VSIX
        run: npm run generate && npm test && npm run package
      - name: Upload separate installable VSIX file
        uses: actions/upload-artifact@v7
        with:
          name: legacyscript-vsix
          path: extensions/legacyscript/legacyscript.vsix
          archive: false
          if-no-files-found: error
      - name: Attach VSIX to engine tag release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" legacyscript.vsix --clobber
