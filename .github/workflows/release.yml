name: Release

# Publish only after every platform/package succeeds; main pushes are prereleases.
# Manual runs publish by default; uncheck Publish GitHub Release for build-only artifacts.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - 'data/**'
      - 'src/**'
      - 'third_party/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'VERSION'
      - 'tools/release_version.py'
      - 'docs/**'
      - 'README.md'
      - 'scripts/**'
      - 'extensions/**'
      - '.github/workflows/windows.yml'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'data/**'
      - 'src/**'
      - 'third_party/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'VERSION'
      - 'tools/release_version.py'
      - 'docs/**'
      - 'README.md'
      - 'scripts/**'
      - 'extensions/**'
      - '.github/workflows/windows.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.2.3 or 1.2.3-rc.1); required when publishing'
        required: false
        type: string
        default: ''
      publish:
        description: 'Publish GitHub Release (listed on the repository Releases page)'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

# Serialize publishing/reruns to avoid racing the same tag's assets.
concurrency:
  group: release-${{ github.event.inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve engine version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and tag target
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          PUBLISH_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && 'true' || 'false' }}
        run: python3 tools/release_version.py

  linux:
    needs: version
    env:
      ENGINE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    name: Linux x86_64
    # The binary needs a system at least as new as the one it is built on.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Use an isolated Ubuntu source list: neither the Azure mirror nor
      # unrelated third-party repositories on the runner can stall this build.
      # Try a second HTTPS mirror if metadata or package downloads fail.
      - name: Install build dependencies
        timeout-minutes: 14
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          packages=(
            build-essential cmake ninja-build pkg-config git
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev
            libxi-dev libxss-dev libxtst-dev
            libwayland-dev libxkbcommon-dev libdecor-0-dev
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev
            libdbus-1-dev libibus-1.0-dev libudev-dev libusb-1.0-0-dev
            libasound2-dev libpulse-dev libpipewire-0.3-dev libjack-dev libsndio-dev
            libfribidi-dev libthai-dev liburing-dev
          )
          sources="$RUNNER_TEMP/legacy-ubuntu.list"
          apt_options=(
            -o "Dir::Etc::sourcelist=$sources"
            -o Dir::Etc::sourceparts=-
            -o Acquire::ForceIPv4=true
            -o Acquire::Languages=none
            -o Acquire::Retries=1
            -o Acquire::http::Timeout=15
            -o Acquire::https::Timeout=15
            -o DPkg::Lock::Timeout=30
          )
          for mirror in https://mirrors.edge.kernel.org/ubuntu https://archive.ubuntu.com/ubuntu; do
            echo "::group::Ubuntu dependencies from $mirror"
            : > "$sources"
            for suite in noble noble-updates noble-security; do
              printf 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] %s %s main universe restricted multiverse\n' \
                "$mirror" "$suite" >> "$sources"
            done
            if sudo timeout --signal=TERM --kill-after=15s 90s \
                apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update &&
               sudo --preserve-env=DEBIAN_FRONTEND timeout --signal=TERM --kill-after=15s 270s \
                apt-get "${apt_options[@]}" install -y --no-install-recommends "${packages[@]}"; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::Dependency installation from $mirror failed or timed out; trying the next mirror."
          done
          echo "::error::Both Ubuntu mirrors failed within their time limits. See the APT output above."
          exit 1

      # SDL, Jolt, libstdc++ and libgcc are linked statically so that
      # the binary runs without any of them installed.
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLEGACY_ENGINE_VERSION="$ENGINE_VERSION" \
            -DBUILD_TESTING=OFF \
            -DLEGACY_VENDORED_SDL=ON \
            "-DCMAKE_EXE_LINKER_FLAGS=-static-libgcc -static-libstdc++ -s"

      # SDL builds without a display backend whose development packages are
      # missing (it only stops when both are), and the released binary has to
      # work on X11 and on Wayland.
      - name: Check that SDL supports X11 and Wayland
        run: |
          config=$(find build/_deps/sdl3-build -name SDL_build_config.h)
          for feature in SDL_VIDEO_DRIVER_X11 SDL_VIDEO_DRIVER_WAYLAND \
                         SDL_VIDEO_OPENGL_GLX SDL_VIDEO_OPENGL_EGL; do
            if ! grep -q "^#define $feature 1" "$config"; then
              echo "::error::SDL was configured without $feature"
              exit 1
            fi
          done

      - name: Build
        run: cmake --build build --parallel 2

      # README.md says which glibc the binary needs. The number depends on what
      # is linked into the binary, so show it on the page of the run.
      - name: Report the glibc version the binary needs
        run: |
          needed=$(objdump -T build/LegacyEngine | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1)
          echo "::notice::The binary needs glibc ${needed#GLIBC_} or newer"

      - name: Build offline documentation
        run: |
          python3 -m venv "$RUNNER_TEMP/docs-tools"
          "$RUNNER_TEMP/docs-tools/bin/python" -m pip install -r docs/requirements.txt
          "$RUNNER_TEMP/docs-tools/bin/python" docs/build.py --output build/docs --revision "$GITHUB_SHA"
          test -s build/docs/scripting-reference.html
          cd build/docs
          "$RUNNER_TEMP/docs-tools/bin/python" -m zipfile -c ../legacyengine-docs.zip *.html style.css screenshot.png LICENSE

      - name: Upload offline HTML documentation
        uses: actions/upload-artifact@v4
        with:
          name: legacyengine-docs
          path: build/docs/
          if-no-files-found: error
          retention-days: 30

      - name: Package
        run: |
          package=LegacyEngine-$ENGINE_VERSION-linux-x86_64

          mkdir -p "$package"
          cp build/LegacyEngine build/LegacyPlayer "$package/"
          # Keep symbols in build/ for diagnosis, not in the shipped executable.
          strip --strip-unneeded "$package/LegacyEngine" "$package/LegacyPlayer"
          cmake -DPLAYER="$package/LegacyPlayer" -P cmake/player_template.cmake
          cp LICENSE "$package/"
          cp -r build/docs "$package/docs"
          test -s "$package/docs/scripting-reference.html"
          cp -r scripts "$package/"
          python3 tools/collect_licenses.py build
          cp -r data "$package/"
          cp .luarc.json "$package/"
          test -s "$package/data/license/SDL3.txt"
          test -s "$package/data/license/assimp.txt"
          tar -czf "$package.tar.gz" "$package"

          echo "PACKAGE=$package" >> "$GITHUB_ENV"

      # Not zipped: what the run offers for download is the .tar.gz itself.
      - uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: ${{ env.PACKAGE }}.tar.gz
          if-no-files-found: error


  vsix:
    name: Build LegacyScript VSIX
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: extensions/legacyscript
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extensions/legacyscript/package-lock.json
      - name: Install extension dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate API and package VSIX
        run: npm run generate && npm run package
      - name: Upload separate installable VSIX file
        uses: actions/upload-artifact@v4
        with:
          name: legacyscript-vsix
          path: extensions/legacyscript/legacyscript.vsix
          if-no-files-found: error

      - name: Package Sublime Text support
        working-directory: .
        run: |
          python3 -m zipfile -c LegacyScript-SublimeText4.zip extensions/sublime-legacyscript
      - uses: actions/upload-artifact@v4
        with:
          name: legacyscript-sublime
          path: LegacyScript-SublimeText4.zip
          if-no-files-found: error

  windows:
    name: Windows packages
    needs: version
    uses: ./.github/workflows/windows.yml
    with:
      engine_version: ${{ needs.version.outputs.version }}

  publish:
    name: Publish complete GitHub Release
    needs: [version, linux, windows, vsix]
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          # Documentation is uploaded as a directory; recreate its standalone zip.
          python3 -m zipfile -c release-assets/legacyengine-docs.zip release-artifacts/legacyengine-docs/*
          find release-artifacts -type f \( -name '*.tar.gz' -o -name 'LegacyEngine-*.zip' -o -name '*.vsix' -o -name 'LegacyScript-SublimeText4.zip' \) -exec cp {} release-assets/ \;
          test -s "release-assets/LegacyEngine-${{ needs.version.outputs.version }}-linux-x86_64.tar.gz"
          test -s "release-assets/LegacyEngine-${{ needs.version.outputs.version }}-Windows-x64.zip"
          test -s "release-assets/LegacyEngine-${{ needs.version.outputs.version }}-Windows7-x64-experimental.zip"
          test -s release-assets/legacyscript.vsix
          test -s release-assets/LegacyScript-SublimeText4.zip
          (cd release-assets && sha256sum * > SHA256SUMS.txt)
      - name: Publish after all builds succeeded
        shell: bash
        run: |
          set -euo pipefail
          # Never attach another commit's binaries to an existing tag.
          if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" > /dev/null 2>&1; then
            remote_commit=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq '.sha')
            test "$remote_commit" = "$GITHUB_SHA" || { echo 'Tag points to another commit'; exit 1; }
          fi
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            flags=()
            if [ "$PRERELEASE" = true ]; then flags+=(--prerelease --latest=false); fi
            # Keep it off the public Releases page until every upload completes.
            gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" \
              --generate-notes --title "LegacyEngine $RELEASE_TAG" "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease --latest=false); fi
          gh release edit "$RELEASE_TAG" --draft=false "${flags[@]}"
          release_url=$(gh release view "$RELEASE_TAG" --json url --jq '.url')
          echo "## Complete release published: [$RELEASE_TAG]($release_url)" >> "$GITHUB_STEP_SUMMARY"
